[project]
name = "omni-doc-parser"
version = "0.1.0"
description = "MinerU2.5-Pro document extraction and XML synthesis pipeline"
requires-python = ">=3.10, <3.14"
dependencies = [
    "mineru[all]>=3.1.0",
    "wandb>=0.26.0",
    "matplotlib>=3.9.0",
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "networkx>=3.4.2",
    "vllm>=0.11.0",
    "transformers>=4.57.6",
    "nvitop>=1.7.0",
    "datasets>=4.8.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
